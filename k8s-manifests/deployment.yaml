apiVersion: apps/v1
kind: Deployment
metadata:
  name: gold-profit-app
  namespace: gold-profit-app-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gold-profit-app
  template:
    metadata:
      labels:
        app: gold-profit-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: gold-profit-app
          image: nguyenphong8852/gold-profit-app:19
          ports:
            - containerPort: 3000   # sửa theo server.js / Dockerfile
          readinessProbe:
            httpGet:
              path: /health         # sửa theo endpoint thật
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gold-profit-app
  namespace: gold-profit-app-demo
spec:
  type: ClusterIP
  selector:
    app: gold-profit-app
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gold-profit-app
  namespace: gold-profit-app-demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: gold-profit-app-tls       # cert riêng cho gold-app.local
      hosts:
        - gold-app.local
  rules:
    - host: gold-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gold-profit-app
                port:
                  number: 80